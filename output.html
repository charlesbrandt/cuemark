<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* html is set alongside body deliberately: during Bug A a magenta background here was
         what proved the page paints the full window, distinguishing "nothing drawn" from
         "surface never initialised" — black cannot tell those apart, which is exactly what
         made the corrupt region ambiguous for three sessions. Keep both set to an opaque
         colour so an undrawn region is unambiguously undrawn. */
      html, body { background: #000; overflow: hidden; }
      /* Layout size comes from resize() in output.ts per CLAUDE.md's canvas rule; these are
         a fallback only, covering the window between first paint and first observe. The
         *drawing buffer* is fixed at the output resolution by the width/height attributes
         below — CSS only scales it, so resizing this window never reallocates deck FBOs. */
      canvas { display: block; width: 100vw; height: 100vh; }
      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font: 12px 'Courier New', monospace;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 14px;
        border-radius: 4px;
        pointer-events: none;
        animation: fadeout 2s forwards;
        animation-delay: 2s;
      }
      @keyframes fadeout { to { opacity: 0; } }
      /* Visible from load until the first frame message arrives, then hidden for good
         (output.ts). It reports a dead channel — not a static picture, which is a
         perfectly normal state and must not raise an alarm. Deliberately small, dim and
         cornered rather than a full-screen banner: this can be live on a projector
         mid-performance, where a diagnostic that ruins the projection is worse than the
         fault it reports. */
      #nosignal {
        position: fixed;
        bottom: 8px;
        right: 10px;
        color: rgba(255, 255, 255, 0.35);
        font: 11px 'Courier New', monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="output" width="1920" height="1080"></canvas>
    <div id="hint">F — toggle fullscreen &nbsp;·&nbsp; Esc — exit fullscreen</div>
    <div id="nosignal">waiting for frames from the control window…</div>
    <script type="module" src="/src/output.ts"></script>
  </body>
</html>
