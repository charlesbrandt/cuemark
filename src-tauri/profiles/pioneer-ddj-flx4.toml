# Sampler mode (0x30-0x37) is deliberately NOT bound — cuemark has no sample-slot
# concept at all yet (docs/design/ddj-flx4-feature-gaps.md §4), so there is nothing
# for these pads to drive.

# Beat Jump pad mode (SHIFT+Beat Loop button, jump ±1/2/4/8 beats via the 8 pads) is
# ALSO deliberately NOT bound here, but for a different reason: the `beat_jump` action
# it needs already exists (see the SHIFT+Cue/Loop-Call 32-beat rows above, which use
# it). What's missing is the byte capture. Mixxx's own mapping puts these pads at
# status 0x97/0x99 d1 0x20-0x27 — but this profile's Beat Loop mode pads (loop_preset,
# above) were LIVE-CAPTURED on this exact unit at the same status/d1 0x20-0x23. Either
# Mixxx's reference disagrees with this unit's firmware, or the two pad modes really do
# share wire bytes and can't be told apart without a mode-select signal this profile
# system doesn't model — either way, guessing here would likely bind the wrong pads to
# the wrong action. Needs a real capture (controller physically switched into Beat Jump
# pad mode, all 8 pads pressed) before writing these rows.

