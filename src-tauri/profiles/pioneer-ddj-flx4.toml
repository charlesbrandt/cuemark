# ── Jog wheels — captured live 2026-08-22 (§8.2) ─────────────────────────────────
# offset64 encoding (byte 63/65/66 centered on 64 — NOT two's complement, which
# would put -1 at 0x7F not 0x3F). CC 0x22 = turn while touched (captured directly on
# deck 2 / 0xB1); CC 0x21 = untouched/pitch-bend rotation (same action for now — no
# distinct pitch-bend behaviour is built yet, this is a placeholder mapping, not a
# statement that bend and scratch should feel identical). Deck 1 / 0xB0 rows are
# inferred by symmetry, not directly captured — same caveat as the Starlight's own
# right-hot-cue-channel "by symmetry; unverified" note.

[[control]]
status = 0xB0
d1 = 0x22
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 0
note = "inferred by symmetry from the captured 0xB1 side, not directly captured"

[[control]]
status = 0xB0
d1 = 0x21
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 0
note = "inferred by symmetry; untouched/pitch-bend rotation, same action as 0x22 for now"

[[control]]
status = 0xB1
d1 = 0x22
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 1

[[control]]
