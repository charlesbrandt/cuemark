# Headphones Mix is actually a cue/master BALANCE knob, not a pure level — bound to
# the closest existing action (cue_gain) for this trimmed pass rather than inventing
# a new action; the semantic mismatch is real and worth revisiting once someone can
# turn this knob and listen.
[[control]]
status = 0xB6
d1 = 0x0C
kind = "fader14"
lsb_d1 = 0x2C
action = "cue_gain"
note = "from Mixxx mapping, not live-verified on this unit; this is a cue/master BALANCE knob, not a pure level — see comment above"

# Master level and headphone OUTPUT level are confirmed hardware-analog-only on this
# unit (docs/design/ddj-flx4-feature-gaps.md §8) — no MIDI bytes exist for them, so
# there is nothing to bind.
