# ── Tempo faders — captured live 2026-08-22 (§8.7) ───────────────────────────────
# 14-bit, MSB (0xB0/0xB1, 0) + LSB (..., 32). invert = false: higher raw value =
# faster on this unit — the OPPOSITE of the Starlight's own convention (which sets
# invert = true to recover its unchanged original behaviour). See
# decode.rs's tempo_from_14bit doc comment for what "natural"/"invert" mean.

[[control]]
status = 0xB0
d1 = 0
kind = "fader14"
action = "tempo"
slot = 0
invert = false

[[control]]
status = 0xB1
d1 = 0
kind = "fader14"
action = "tempo"
slot = 1
invert = false

# ── Jog wheels — captured live 2026-08-22 (§8.2) ─────────────────────────────────
# offset64 encoding (byte 63/65/66 centered on 64 — NOT two's complement, which
# would put -1 at 0x7F not 0x3F). CC 0x22 = turn while touched (captured directly on
# deck 2 / 0xB1); CC 0x21 = untouched/pitch-bend rotation (same action for now — no
# distinct pitch-bend behaviour is built yet, this is a placeholder mapping, not a
# statement that bend and scratch should feel identical). Deck 1 / 0xB0 rows are
# inferred by symmetry, not directly captured — same caveat as the Starlight's own
# right-hot-cue-channel "by symmetry; unverified" note.

[[control]]
status = 0xB0
d1 = 0x22
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 0
note = "inferred by symmetry from the captured 0xB1 side, not directly captured"

[[control]]
status = 0xB0
d1 = 0x21
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 0
note = "inferred by symmetry; untouched/pitch-bend rotation, same action as 0x22 for now"

[[control]]
status = 0xB1
d1 = 0x22
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 1

[[control]]
status = 0xB1
d1 = 0x21
kind = "relative"
encoding = "offset64"
action = "jog_turn"
slot = 1
note = "untouched/pitch-bend rotation, same action as 0x22 for now"

# Jog touch (0x90/0x91, 0x36) is deliberately NOT bound here. It's real and captured
# (§11), but JogTouch precedence — whether touching a *playing* deck's platter should
# trigger scratch-over-playback — is an open design question
# (docs/design/controller-mapping.md §10, docs/design/waveform-scrub.md), not
# something to wire to nothing just because the byte is known.

