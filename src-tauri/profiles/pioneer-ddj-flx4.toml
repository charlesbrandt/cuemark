# CORRECTED 2026-08-22, live-verified with an independent raw capture (aseqdump against
# the ALSA sequencer port, bypassing cuemark's own code entirely — see
# controller-mapping.md's bench-pass writeup for why an app-level test alone got this
# wrong twice). HEADPHONES MIX and HEADPHONES LEVEL are two real, physically separate
# knobs on DIFFERENT CCs, not one shared control as an earlier pass here concluded:
#   - MIX:   0xB6, CC 0x0C (MSB) / CC 0x2C (LSB) — deliberately left UNBOUND. cuemark has
#            no cue/master mix-ratio concept, so binding it to cue_gain (a plain level)
#            would be the same mismatch the very first version of this file's note flagged.
#   - LEVEL: 0xB6, CC 0x0D (MSB) / CC 0x2D (LSB) — bound below. A pure output level is
#            exactly what cue_gain is.
[[control]]
status = 0xB6
d1 = 0x0D
kind = "fader14"
lsb_d1 = 0x2D
action = "cue_gain"
note = "live-verified 2026-08-22 via independent aseqdump capture — 0xB6/0x0D+0x2D is the LEVEL knob specifically (see comment above), value swept smoothly on a real turn"

# Master level is confirmed hardware-analog-only on this unit (no MIDI bytes observed).
# Headphone OUTPUT level is NOT analog-only, despite what this comment and
# ddj-flx4-feature-gaps.md §8 both claimed before 2026-08-22 (sourced from the manual,
# not a capture) — see the MIX/LEVEL block above, both send real MIDI.
