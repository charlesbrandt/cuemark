# Pioneer DJ DDJ-FLX4 — first real profile, authored 2026-08-22. Two different kinds
# of evidence back the rows below, and they are NOT equally trustworthy:
#
#   * Rows with no `note` field were captured live on this exact unit with cuemark's
#     own raw MIDI monitor (docs/design/controller-mapping.md §8/§11) — jog encoding,
#     jog-touch note, pad-mode CC layout, deck-slot count, tempo fader direction.
#   * Rows marked `note = "from Mixxx mapping, not live-verified on this unit"` are
#     taken from Mixxx's shipped Pioneer-DDJ-FLX4.midi.xml (a third party's reference,
#     not our own capture) because no bench pass covered these controls yet — play,
#     cue, sync, faders, EQ, filter, crossfader, headphone mix. Treat them as
#     candidates, not facts, until a live pass confirms them (see the standing
#     "capture before designing" rule this project has been bitten by before).
#
# LED output, the browse encoder, Beat FX, Sampler pads, and jog touch-as-scratch-
# trigger are deliberately NOT in this file — see
# docs/design/controller-mapping.md §6/§10/§11 and docs/design/ddj-flx4-feature-gaps.md.
# This profile is input-only; cuemark has no MIDI output code at all yet.

id = "pioneer-ddj-flx4"
name = "Pioneer DJ DDJ-FLX4"
match = ["ddj-flx4", "flx4"]
slots = 2
centre_snap = 0.02
# Captured live 2026-08-22: 5 slow + 5 fast revolutions measured 3602/3615 ticks
# (720.4-723.0/rev, 0.4% apart) — controller-mapping.md §8.2.
jog_ticks_per_rev = 721.7

# ── Deck 1 (slot 0) — status 0x90 (notes) / 0xB0 (CC) ────────────────────────────

[[control]]
status = 0x90
d1 = 0x0B
kind = "button"
action = "play_toggle"
slot = 0
note = "live-verified 2026-08-22 (FLX4 alone, no Starlight) — works"

[[control]]
status = 0x90
d1 = 0x0C
kind = "button"
action = "cue_jump"
slot = 0
note = "live-verified 2026-08-22 (FLX4 alone, no Starlight) — works"

[[control]]
status = 0x90
d1 = 0x58
kind = "button"
action = "sync_toggle"
slot = 0
note = "live-verified 2026-08-22 (FLX4 alone, no Starlight) — wire byte confirmed (0x90/0x58 vel 127), resolves to SyncToggle{slot:0}. Button LED stayed unlit, which is expected (profile has no MIDI output/LED sync yet, see file header). Deck-bpm-syncing effect not exercised — no track loaded during this pass."

[[control]]
status = 0x90
d1 = 0x54
kind = "button"
action = "headphone_cue"
slot = 0
note = "live-verified 2026-08-22 — 0x90/0x54 vel 127 -> HeadphoneCue{slot:0}, confirmed working end to end in the UI. LED doesn't light (MIDI output not built yet, see todo.md)"

# Channel fader vs. Trim: the FLX4 has BOTH, unlike the Starlight's single fader.
# Bound to the DJ-workflow-typical split — the channel fader (the one a DJ rides
# during a mix) drives volume, the trim knob drives gain (pre-fader trim, matching
# DeckGain's existing doc comment exactly). This is a judgment call, not a captured
# fact — the Starlight convention (fader -> gain, volume MIDI-unbound) doesn't
# transfer cleanly since it never had a separate trim knob to give gain to instead.
[[control]]
status = 0xB0
d1 = 0x13
kind = "fader14"
lsb_d1 = 0x33
action = "volume"
slot = 0
note = "live-verified 2026-08-22 — bottom to top, value rose smoothly 0.28->0.98, correct direction"

[[control]]
status = 0xB0
d1 = 0x04
kind = "fader14"
lsb_d1 = 0x24
action = "gain"
slot = 0
note = "live-verified 2026-08-22 (Trim knob -> gain) — CCW to CW, value rose smoothly toward 1.0, correct direction"

[[control]]
status = 0xB0
d1 = 0x07
kind = "fader14"
lsb_d1 = 0x27
action = "eq_high"
slot = 0
note = "live-verified 2026-08-22 — swings through 0dB to +11.6dB correctly. NOTE: the knob's own printed scale reads -26..+6dB; cuemark's actual range is EQ_MIN_DB/EQ_MAX_DB (-24..+12, pipeline.rs) — the wire mapping is correct, this is a deliberate open question about whether to match the printed hardware scale, not a bug. See controller-mapping.md."

[[control]]
status = 0xB0
d1 = 0x0B
kind = "fader14"
lsb_d1 = 0x2B
action = "eq_mid"
slot = 0
note = "live-verified 2026-08-22 — swings -4.4dB..+11.2dB correctly. Same printed-scale-vs-EQ_MIN_DB/MAX_DB note as eq_high above."

[[control]]
status = 0xB0
d1 = 0x0F
kind = "fader14"
lsb_d1 = 0x2F
action = "eq_low"
slot = 0
note = "live-verified 2026-08-22 — swings -3.3dB..+11.4dB correctly. Same printed-scale-vs-EQ_MIN_DB/MAX_DB note as eq_high above."

