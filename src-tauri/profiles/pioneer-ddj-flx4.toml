# Only 4 of the FLX4's 8 physical pads are bound per mode: Deck.hotCues is a
# fixed 4-slot array (types.ts), so hot_cue index 4-7 would have nothing to write
# into; loop_preset uses the first 4 entries of LOOP_PRESET_BEATS (the "plain pad"
