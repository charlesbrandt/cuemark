d1 = 24
kind = "button"
action = "loop_preset"
index = 4
slot = 0

[[control]]
status = 0x96
d1 = 25
kind = "button"
action = "loop_preset"
index = 5
slot = 0

[[control]]
status = 0x96
d1 = 26
kind = "button"
action = "loop_preset"
index = 6
slot = 0

[[control]]
status = 0x96
d1 = 27
kind = "button"
action = "loop_preset"
index = 7
slot = 0

