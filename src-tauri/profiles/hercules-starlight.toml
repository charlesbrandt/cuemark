# ── Global (ch 1) ────────────────────────────────────────────────────────────────

# Crossfader: 14-bit pair — CC 0 (MSB) mapped; CC 32 (LSB) intentionally not tracked
# (kind="fader", not "fader14" — 7-bit resolution deemed sufficient, matching the
# original's explicit comment).
[[control]]
status = 0xB0
d1 = 0
kind = "fader"
action = "crossfader"

[[control]]
status = 0xB0
d1 = 3
kind = "fader"
action = "master_volume"

[[control]]
status = 0xB0
d1 = 4
kind = "fader"
action = "cue_gain"

[[control]]
status = 0x91
d1 = 12
kind = "button"
action = "headphone_cue"
slot = 0

[[control]]
status = 0x92
d1 = 12
kind = "button"
action = "headphone_cue"
slot = 1

# Deliberately unmapped (no action needed — carried over from the original map):
#   (0x90, 3)  = Shift button — controller remaps pads in firmware; no host tracking needed
#   (0x90, 1)  = Bass/Filter button — the controller swaps the tone knob's CC in firmware
#                (CC 2 <-> CC 1), so both modes are already mapped above and there is
#                nothing for the host to do on the button itself.
#                Do NOT "improve" this by tracking mode here — the button is momentary
#                and never reports which mode it selected, so a host-side guess would
#                drift out of sync with the hardware after a reconnect.
#   (0x91, 15) = Hot-cue mode button   (0x91, 16) = Loop mode button
